{% extends 'base.html' %}

{% block title %}
    <title>Password Reset Page</title>
{% endblock %}

{% block main_content %}
<h1>
    ~ Password Reset Page ~
</h1>

<div class="profile">
    <form class="profile-group" method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="form-submit" type="submit">Reset Password</button>
    </form>
</div>
{% endblock %}
